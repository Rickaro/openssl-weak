name: TLS audit (testssl.sh)

# Опциональный workflow: аудит TLS публичного сайта без сборки чего-либо.
# Запускать вручную (Actions -> TLS audit -> Run workflow).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "host или URL (например portal.example.ru)"
        required: true
        type: string
      severity:
        description: "Минимальная важность выводимых проблем"
        required: false
        default: "HIGH"
        type: choice
        options: [LOW, MEDIUM, HIGH, CRITICAL]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout testssl.sh
        uses: actions/checkout@v4
        with:
          repository: testssl/testssl.sh
          path: testssl
          fetch-depth: 1

      - name: Run testssl.sh
        run: |
          set -x
          cd testssl
          ./testssl.sh --severity "${{ inputs.severity }}" --color 0 \
            --htmlfile ../testssl-report.html \
            --jsonfile-pretty ../testssl-report.json \
            "${{ inputs.target }}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testssl-report
          path: |
            testssl-report.html
            testssl-report.json
          if-no-files-found: warn
          retention-days: 30
