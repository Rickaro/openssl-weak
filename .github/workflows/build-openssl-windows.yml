name: Build OpenSSL for Windows (static)

# Собирает openssl.exe под Windows x86_64 статически (без DLL от MinGW)
# и отдаёт готовый портативный набор артефактом.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия OpenSSL без префикса (например 3.5.9 — LTS)"
        required: true
        default: "3.5.9"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-openssl-windows.yml"

permissions:
  contents: read

concurrency:
  group: build-openssl-${{ github.ref }}
  cancel-in-progress: true

env:
  OSSL_VERSION: ${{ inputs.version || '3.5.9' }}

jobs:
  build:
    name: openssl ${{ inputs.version || '3.5.9' }} / mingw64 static
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source and verify SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:OSSL_VERSION
          $base = "https://github.com/openssl/openssl/releases/download/openssl-$v"

          Invoke-WebRequest -UseBasicParsing "$base/openssl-$v.tar.gz" -OutFile openssl-src.tar.gz
          Invoke-WebRequest -UseBasicParsing "$base/openssl-$v.tar.gz.sha256" -OutFile openssl-src.sha256

          # формат файла: "<sha256> *openssl-<ver>.tar.gz"
          $expected = ((Get-Content openssl-src.sha256 -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash openssl-src.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()

          Write-Host "expected: $expected"
          Write-Host "actual:   $actual"
          if ($expected -ne $actual) { throw "SHA256 mismatch for openssl-$v.tar.gz" }

      - name: Setup MSYS2 (mingw64 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make
            perl
            diffutils
            gawk

      - name: Build (MSYS2 / mingw64)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          tar xzf openssl-src.tar.gz
          cd "openssl-${OSSL_VERSION}"

          # no-shared  -> статические библиотеки, exe без openssl DLL
          # no-module  -> провайдеры (включая legacy) вкомпилируются в libcrypto,
          #               а не собираются отдельным legacy.dll
          # -static    -> линковать libgcc/libwinpthread внутрь exe
          # no-tests   -> без тестовых бинарей (сборка быстрее)
          ./Configure mingw64 no-shared no-module no-tests -static \
            --prefix="$PWD/dist" \
            --openssldir="$PWD/dist/ssl"

          make -j"$(nproc)"
          make install_sw

      - name: Assemble portable artifact
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "openssl-${OSSL_VERSION}"

          echo "=== ldd dist/bin/openssl.exe ==="
          ldd dist/bin/openssl.exe || true

          mkdir -p artifact
          cp dist/bin/openssl.exe artifact/
          if [ -f dist/ssl/openssl.cnf ]; then
            cp dist/ssl/openssl.cnf artifact/
          fi
          # страховка: если что-то всё же осталось динамическим — кладём рядом
          for dll in $(ldd dist/bin/openssl.exe | awk '/=> \/mingw64/ {print $3}'); do
            echo "bundling $dll"
            cp "$dll" artifact/
          done

          # staging-каталог вне build-дерева: проверяем ровно то, что скачает
          # пользователь (иначе ossl-modules из dist/ маскирует проблему)
          rm -rf ../verify
          mkdir -p ../verify
          cp artifact/* ../verify/

          echo "=== artifact contents ==="
          ls -la artifact

      - name: "Verify: binary runs from a clean dir"
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd verify

          if ! ./openssl.exe version -a > version.txt 2>&1; then
            echo "::error::openssl.exe не запускается в чистом каталоге (нет DLL рядом?)"
            cat version.txt || true
            ldd ./openssl.exe || true
            exit 1
          fi
          cat version.txt

          {
            echo "# openssl ${OSSL_VERSION} win64 static — проверка в чистом каталоге"
            echo
            cat version.txt
            echo
            echo "## providers"
            ./openssl.exe list -providers || true
            echo
            echo "## ldd"
            ldd ./openssl.exe || true
          } > ../openssl-${OSSL_VERSION}/artifact/build-info.txt

      - name: "Verify: legacy provider is built in (RC4/3DES/DES)"
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd verify

          providers="$(./openssl.exe list -providers -provider default -provider legacy 2>&1)" || true
          printf '%s\n' "$providers"

          if [[ "$providers" != *"legacy"* ]]; then
            echo "::error::legacy provider отсутствует в сборке — RC4/3DES/DES проверить нельзя"
            exit 1
          fi
          echo "legacy provider OK: провайдер загружается"

          # Диагностика: какие слабые TLS-наборы перечисляются. Наличие имени
          # зависит от security level и от того, что libssl вообще отдаёт в
          # список, поэтому это не гейт, а информация в лог.
          enumerated="$(./openssl.exe ciphers -provider default -provider legacy 'ALL:eNULL:aNULL:@SECLEVEL=0' 2>&1)" || true
          weak=""
          for name in DES-CBC3-SHA RC4-SHA RC4-MD5 DES-CBC-SHA IDEA-CBC-SHA SEED-SHA; do
            if [[ ":$enumerated:" == *":$name:"* ]]; then
              weak="$weak $name"
            fi
          done
          if [ -n "$weak" ]; then
            echo "слабые наборы в списке:$weak"
          else
            echo "::warning::libssl не перечисляет слабые TLS-наборы — legacy покроет не всё, см. README"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openssl-${{ env.OSSL_VERSION }}-win64-static
          path: openssl-${{ env.OSSL_VERSION }}/artifact
          if-no-files-found: error
          retention-days: 90
